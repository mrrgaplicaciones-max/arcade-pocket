<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080611">
<title>VAULT POCKET 2</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#080611;--panel:#141126;--panel2:#0e0b1b;--line:#2d2648;--yellow:#ffea00;--cyan:#00eaff;--green:#00f06a;--pink:#ff3aa7;--red:#ff4968;--muted:#8f89a5;--white:#f7f7ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{min-height:100vh;background:radial-gradient(circle at 50% 0,#21133b 0,transparent 52%),var(--bg);color:var(--white);font-family:Nunito,sans-serif;padding:12px 14px 70px}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 12px;border-bottom:2px solid var(--yellow);margin-bottom:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border:1.5px solid var(--yellow);border-radius:14px;display:grid;place-items:center;font-size:25px;background:#171229;box-shadow:0 0 18px #ffea0030}.title{font:11px 'Press Start 2P';color:var(--yellow);letter-spacing:1px}.sub{font-size:10px;color:var(--muted);font-weight:900;margin-top:5px}.lock{background:#171229;border:1.5px solid var(--red);color:var(--red);padding:10px 11px;border-radius:10px;font:8px 'Press Start 2P';box-shadow:2px 2px 0 #741d34}.status{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);background:#111022;border-radius:14px;padding:11px 13px;margin-bottom:10px}.status-left{display:flex;gap:9px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.status strong{font-size:12px}.status small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.count{text-align:right;color:var(--yellow);font:15px 'Press Start 2P'}.count small{color:var(--muted);font:8px Nunito}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}.act{padding:12px 6px;border-radius:11px;background:var(--panel);border:1.5px solid var(--line);color:var(--white);font:8px 'Press Start 2P';box-shadow:2px 2px 0 #050409}.act:active{transform:translate(1px,1px);box-shadow:none}.down{color:var(--cyan);border-color:var(--cyan)}.up{color:var(--green);border-color:var(--green)}.new{color:var(--yellow);border-color:var(--yellow)}.copy{color:var(--pink);border-color:var(--pink)}
.search{margin-bottom:10px}.search input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#0c0916;color:white;outline:none;font-size:15px;font-weight:800}.search input:focus{border-color:var(--cyan);box-shadow:0 0 0 2px #00eaff18}
.form,.modal{background:var(--panel);border:1.5px solid var(--yellow);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 8px 28px #0008}.form h3,.modal h3{font:10px 'Press Start 2P';color:var(--yellow);margin-bottom:12px}.form input,.form select,.modal input,.modal select{width:100%;padding:12px;margin-bottom:8px;border-radius:10px;border:1px solid var(--line);background:#0b0814;color:white;outline:none}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.form-actions{display:flex;gap:8px}.smallbtn{flex:1;padding:11px;border-radius:9px;background:#18132b;border:1px solid var(--line);color:white}.save{color:var(--green);border-color:var(--green)}.cancel{color:var(--red);border-color:var(--red)}
.list{display:flex;flex-direction:column;gap:11px}.card{background:rgba(20,17,38,.96);border:1px solid var(--line);border-left:5px solid var(--cyan);border-radius:16px;padding:13px;box-shadow:0 7px 22px #0008}.card.particular{border-left-color:var(--pink)}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.service{font-size:16px;font-weight:900;word-break:break-word}.badge{font-size:8px;font-weight:900;padding:4px 7px;border:1px solid var(--cyan);color:var(--cyan);border-radius:8px;white-space:nowrap}.particular .badge{border-color:var(--pink);color:var(--pink)}.row{display:flex;align-items:center;gap:8px;background:#0b0814;border:1px solid #211b36;border-radius:11px;padding:9px 10px;margin-top:7px}.value{min-width:0;flex:1;font-size:14px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tool{width:42px;height:38px;border-radius:10px;background:#19142d;border:1px solid #31284c;color:white;font-size:17px}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--muted);font-size:9px}.footer-actions{display:flex;gap:6px}.edit,.del{background:transparent;padding:7px 9px;border-radius:8px;font:8px 'Press Start 2P'}.edit{border:1px solid var(--yellow);color:var(--yellow)}.del{border:1px solid var(--red);color:var(--red)}
.empty{text-align:center;padding:42px 18px;color:var(--muted);border:1px dashed var(--line);border-radius:16px;font-size:12px;line-height:1.6}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#18132b;border:1px solid var(--cyan);color:white;padding:11px 15px;border-radius:12px;font-weight:900;font-size:11px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.overlay{position:fixed;inset:0;background:#06040ddd;backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px;z-index:30}.auth{width:min(360px,100%);background:#121022;border:1.5px solid var(--yellow);border-radius:20px;padding:22px;text-align:center;box-shadow:0 15px 60px #000}.auth h2{font:12px 'Press Start 2P';color:var(--yellow);margin-bottom:12px}.pin{font:24px 'Press Start 2P';letter-spacing:7px;height:38px;margin-bottom:15px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.key{height:55px;background:#19142d;border:1px solid var(--line);border-radius:12px;color:white;font:15px 'Press Start 2P'}.key.ok{color:var(--green);border-color:var(--green)}.key.del{color:var(--red);border-color:var(--red)}.hint{font-size:10px;color:var(--muted);margin-top:13px;line-height:1.5}
</style>
</head>
<body>
<div id="auth" class="overlay"><div class="auth"><h2>🔐 VAULT POCKET</h2><div id="pin" class="pin">----</div><div class="keys"><button class="key" onclick="pinKey('1')">1</button><button class="key" onclick="pinKey('2')">2</button><button class="key" onclick="pinKey('3')">3</button><button class="key" onclick="pinKey('4')">4</button><button class="key" onclick="pinKey('5')">5</button><button class="key" onclick="pinKey('6')">6</button><button class="key" onclick="pinKey('7')">7</button><button class="key" onclick="pinKey('8')">8</button><button class="key" onclick="pinKey('9')">9</button><button class="key del" onclick="pinClear()">DEL</button><button class="key" onclick="pinKey('0')">0</button><button class="key ok" onclick="unlock()">OK</button></div><div class="hint">Llavero personal · protección de acceso local</div></div></div>
<header><div class="brand"><div class="logo">🔑</div><div><div class="title">VAULT POCKET</div><div class="sub">SAFEHOUSE · SIMPLE · FIABLE</div></div></div><button class="lock" onclick="lockApp()">BLOQUEAR</button></header>
<div class="status"><div class="status-left"><span class="dot"></span><div><strong>VAULT DESBLOQUEADO</strong><small>Datos locales · nube opcional</small></div></div><div class="count"><span id="count">0</span><small>CLAVES</small></div></div>
<div class="actions"><button class="act down" onclick="downloadCloud()">☁ BAJAR</button><button class="act up" onclick="uploadCloud()">☁ SUBIR</button><button class="act new" onclick="toggleNew()">＋ NUEVA</button><button class="act copy" onclick="backup()">💾 COPIA</button><button class="act" style="color:#ff9f43;border-color:#ff9f43" onclick="undoLast()">↶ DESHACER</button></div>
<div class="search"><input id="search" placeholder="🔎 Buscar servicio o usuario…" oninput="render()"></div>
<div id="newForm" class="form hidden"><h3>NUEVA CREDENCIAL</h3><input id="ns" placeholder="Servicio (ej. Correo, SARA)"><input id="nu" placeholder="Usuario"><input id="np" type="text" placeholder="Contraseña"><div class="form-row"><select id="nt"><option>Común</option><option>Particular</option></select><button class="smallbtn save" onclick="addCredential()">GUARDAR</button></div></div>
<div id="list" class="list"></div>
<div id="editModal" class="overlay hidden"><div class="modal"><h3>EDITAR CREDENCIAL</h3><input id="es"><input id="eu"><input id="ep" type="text"><select id="et"><option>Común</option><option>Particular</option></select><div class="form-actions"><button class="smallbtn cancel" onclick="closeEdit()">CANCELAR</button><button class="smallbtn save" onclick="saveEdit()">GUARDAR</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const PIN='1981';
// Sustituir por la URL del nuevo despliegue de Apps Script cuando esté creado.
const CLOUD_URL='https://script.google.com/macros/s/AKfycbzr27kS6ZtDX3GSqjWRUTGxF1Uecp1x96yVAaPmPB4h2ogTRRcBdcR31IcUG0ZI3CNu/exec';
const KEY='arcade_vault'; const BACKUP_KEY='arcade_vault_backup';
let vault=[],pinBuf='',editIndex=-1;
function legacyDecode(v){try{return decodeURIComponent(atob(v))}catch(e){return String(v??'')}}
function legacyEncode(v){return btoa(encodeURIComponent(String(v??'')))}
function load(){try{const raw=localStorage.getItem(KEY);vault=raw?JSON.parse(raw):[]}catch(e){vault=[]}normalize();render()}
function normalize(){if(!Array.isArray(vault))vault=[];vault=vault.map(x=>({...x,servicio:String(x.servicio??''),usuario:String(x.usuario??''),tipo:x.tipo==='Particular'?'Particular':'Común',fechaModif:String(x.fechaModif??''),passwordCifrada:typeof x.passwordCifrada==='string'?x.passwordCifrada:legacyEncode('')}))}
function commit(previous,reason='cambio'){localStorage.setItem(BACKUP_KEY,JSON.stringify({when:new Date().toISOString(),reason,vault:previous}));localStorage.setItem(KEY,JSON.stringify(vault))}
function undoLast(){try{const raw=localStorage.getItem(BACKUP_KEY);if(!raw){toast('NO HAY DESHACER DISPONIBLE');return}const b=JSON.parse(raw);if(!Array.isArray(b.vault)){toast('COPIA DE DESHACER INVÁLIDA');return}if(!confirm('¿Restaurar el último estado guardado?'))return;vault=b.vault;normalize();localStorage.setItem(KEY,JSON.stringify(vault));render();toast('↶ ÚLTIMO CAMBIO DESHECHO')}catch(e){toast('⚠ NO SE PUDO DESHACER')}}
function today(){const d=new Date();return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`}
function pinKey(n){if(pinBuf.length<6){pinBuf+=n;document.getElementById('pin').textContent='•'.repeat(pinBuf.length)}}
function pinClear(){pinBuf='';document.getElementById('pin').textContent='----'}
function unlock(){if(pinBuf===PIN){document.getElementById('auth').classList.add('hidden');pinClear();load()}else{document.getElementById('pin').textContent='ERROR';setTimeout(pinClear,650)}}
function lockApp(){document.getElementById('auth').classList.remove('hidden');pinClear()}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),1800)}
function toggleNew(){document.getElementById('newForm').classList.toggle('hidden')}
function addCredential(){const s=document.getElementById('ns').value.trim(),u=document.getElementById('nu').value.trim(),p=document.getElementById('np').value,t=document.getElementById('nt').value;if(!s||!p){toast('⚠ FALTA SERVICIO O CONTRASEÑA');return}const previous=JSON.parse(JSON.stringify(vault));vault.push({servicio:s,usuario:u,passwordCifrada:legacyEncode(p),tipo:t,fechaModif:today()});commit(previous,'antes de alta');render();['ns','nu','np'].forEach(id=>document.getElementById(id).value='');toggleNew();toast('✓ CLAVE AÑADIDA')}
function render(){const q=document.getElementById('search').value.trim().toLowerCase(),list=document.getElementById('list');document.getElementById('count').textContent=vault.length;list.innerHTML='';const items=vault.map((x,i)=>({x,i})).filter(({x})=>!q||x.servicio.toLowerCase().includes(q)||x.usuario.toLowerCase().includes(q)).sort((a,b)=>a.x.servicio.localeCompare(b.x.servicio,'es',{sensitivity:'base'}));if(!items.length){list.innerHTML='<div class="empty">'+(vault.length?'NO HAY RESULTADOS.':'LLAVERO VACÍO.<br>Usa ＋ NUEVA o ☁ BAJAR.')+'</div>';return}for(const {x,i} of items){const card=document.createElement('div');card.className='card '+(x.tipo==='Particular'?'particular':'');const pass=legacyDecode(x.passwordCifrada);card.innerHTML=`<div class="top"><div class="service"></div><span class="badge">${esc(x.tipo)}</span></div><div class="row"><span class="value">${esc(x.usuario)||'<span style="color:#777">(Sin usuario)</span>'}</span><button class="tool" title="Copiar usuario">📋</button></div><div class="row"><span class="value pass">••••••••</span><button class="tool eye">👁️</button><button class="tool keycopy">🔑</button></div><div class="footer"><span>Modif. ${esc(x.fechaModif)||'—'}</span><div class="footer-actions"><button class="edit">EDITAR</button><button class="del">BORRAR</button></div></div>`;card.querySelector('.service').textContent=x.servicio;card.querySelector('.tool').onclick=()=>copy(x.usuario,'USUARIO');card.querySelector('.eye').onclick=()=>{const el=card.querySelector('.pass');el.textContent=el.textContent==='••••••••'?pass:'••••••••'};card.querySelector('.keycopy').onclick=()=>copy(pass,'CONTRASEÑA');card.querySelector('.edit').onclick=()=>openEdit(i);card.querySelector('.del').onclick=()=>deleteCredential(i);list.appendChild(card)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function copy(v,label){try{await navigator.clipboard.writeText(String(v??''));toast('✓ '+label+' COPIADO')}catch(e){toast('⚠ NO SE PUDO COPIAR')}}
function deleteCredential(i){if(!confirm(`¿Borrar “${vault[i].servicio}”?`))return;const previous=JSON.parse(JSON.stringify(vault));vault.splice(i,1);commit(previous,'antes de borrado');render();toast('↶ CLAVE BORRADA · COPIA DISPONIBLE')}
function openEdit(i){editIndex=i;const x=vault[i];document.getElementById('es').value=x.servicio;document.getElementById('eu').value=x.usuario;document.getElementById('ep').value=legacyDecode(x.passwordCifrada);document.getElementById('et').value=x.tipo;document.getElementById('editModal').classList.remove('hidden')}
function closeEdit(){document.getElementById('editModal').classList.add('hidden');editIndex=-1}
function saveEdit(){if(editIndex<0)return;const s=document.getElementById('es').value.trim(),u=document.getElementById('eu').value.trim(),p=document.getElementById('ep').value,t=document.getElementById('et').value;if(!s||!p){toast('⚠ FALTAN DATOS');return}const previous=JSON.parse(JSON.stringify(vault));vault[editIndex]={...vault[editIndex],servicio:s,usuario:u,passwordCifrada:legacyEncode(p),tipo:t,fechaModif:today()};commit(previous,'antes de edición');closeEdit();render();toast('✓ CAMBIOS GUARDADOS')}
function backup(){const data={format:'VAULT-POCKET-SIMPLE',version:2,created:new Date().toISOString(),vault};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vault-pocket-backup.json';a.click();URL.revokeObjectURL(a.href);toast('💾 COPIA DESCARGADA')}
function normalizeRemote(data){let v=data?.vault??data?.data??data;if(typeof v==='string'){try{v=JSON.parse(v)}catch(e){}}return Array.isArray(v)?v:[]}
async function downloadCloud(){if(!CLOUD_URL){toast('⚠ CONFIGURA LA NUBE');return}if(!confirm('¿Reemplazar las claves de ESTE dispositivo con la copia de Google Sheets?'))return;try{toast('☁ BAJANDO…');const r=await fetch(CLOUD_URL+'?action=getVault&ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();if(data.status&&data.status!=='success')throw new Error(data.message||'Respuesta no válida');const remote=normalizeRemote(data);if(!remote.length){throw new Error('Google Sheets devolvió 0 claves')};const previous=JSON.parse(JSON.stringify(vault));vault=remote;normalize();commit(previous,'antes de BAJAR');render();toast('✓ '+vault.length+' CLAVES DESCARGADAS')}catch(e){toast('❌ NO SE PUDO BAJAR');alert('No se ha cambiado el llavero local.\n\nMotivo: '+e.message)}}
async function uploadCloud(){if(!CLOUD_URL){toast('⚠ CONFIGURA LA NUBE');return}if(!vault.length){toast('⚠ LLAVERO VACÍO');return}if(!confirm(`¿Reemplazar la copia de Google Sheets con tus ${vault.length} claves?`))return;try{localStorage.setItem(BACKUP_KEY,JSON.stringify({when:new Date().toISOString(),reason:'antes de SUBIR',vault:JSON.parse(JSON.stringify(vault))}));toast('☁ SUBIENDO…');await fetch(CLOUD_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'saveVault',vault})});toast('✓ ENVÍO REALIZADO · revisa la nube antes de borrar nada')}catch(e){toast('❌ NO SE PUDO ENVIAR');alert('El llavero local sigue intacto.\n\nMotivo: '+e.message)}}
window.addEventListener('load',()=>document.getElementById('auth').classList.remove('hidden'));
</script>
</body></html>
