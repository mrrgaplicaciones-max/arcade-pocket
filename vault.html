    <style>
:root{
    --bg:#07050d;--surface:#12101d;--surface2:#181427;--surface3:#0d0a16;
    --line:#2c2640;--text:#f7f5ff;--muted:#9992ad;
    --yellow:#ffea00;--cyan:#00eaff;--green:#24ff7a;--pink:#ff3f9f;--red:#ff4b55;
    --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{
    min-height:100dvh;
    background:radial-gradient(circle at 50% -5%,rgba(80,38,135,.34),transparent 42%),linear-gradient(180deg,#0a0712 0%,var(--bg) 42%);
    color:var(--text);font-family:'Nunito',sans-serif;
    padding:calc(10px + var(--safe-top)) 12px calc(28px + var(--safe-bottom));
    overscroll-behavior-y:contain;
}
button,input,select{font:inherit}
button{min-height:44px;border-radius:10px;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

/* Header */
header{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin:calc(-10px - var(--safe-top)) -12px 10px;padding:calc(10px + var(--safe-top)) 12px 10px;
    background:rgba(7,5,13,.90);border-bottom:1px solid rgba(255,234,0,.28);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)
}
.header-title-box{min-width:0;display:flex;align-items:center;gap:9px}
.header-icon{
    flex:0 0 auto;display:grid;place-items:center;width:38px;height:38px;
    border:1px solid rgba(255,234,0,.5);border-radius:11px;background:rgba(255,234,0,.07);
    font-size:19px;filter:drop-shadow(0 0 8px rgba(255,234,0,.45))
}
.header-title{font-family:'Press Start 2P',cursive;font-size:10px;color:var(--yellow);letter-spacing:.8px;white-space:nowrap}
.header-sub{margin-top:4px;color:var(--muted);font-size:10px;font-weight:800}
.btn-lock-top{
    flex:0 0 auto;min-height:42px;padding:0 11px;border:1px solid rgba(255,75,85,.7);
    color:#ff7b82;background:rgba(255,75,85,.08);font-family:'Press Start 2P',cursive;font-size:7px;
    box-shadow:0 3px 0 rgba(255,75,85,.25)
}
.btn-lock-top:active{transform:translateY(2px);box-shadow:none}

/* Action buttons */
.actions-bar{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.act-btn{
    display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:8px 6px;
    border:1px solid var(--line);background:linear-gradient(180deg,var(--surface2),var(--surface));
    color:var(--text);font-size:12px;font-weight:900;letter-spacing:.2px;box-shadow:0 3px 0 rgba(0,0,0,.35);
    transition:transform .12s ease,filter .12s ease
}
.act-btn:active{transform:translateY(2px);box-shadow:none;filter:brightness(1.15)}
.btn-down{border-color:rgba(0,234,255,.55);color:var(--cyan)}
.btn-up{border-color:rgba(36,255,122,.55);color:var(--green)}
.btn-new{border-color:rgba(255,234,0,.55);color:var(--yellow)}
.btn-exp{border-color:rgba(255,63,159,.55);color:var(--pink)}

/* Search */
.search-box{position:sticky;top:calc(60px + var(--safe-top));z-index:40;margin-bottom:12px;padding:4px 0;background:linear-gradient(180deg,rgba(7,5,13,.98),rgba(7,5,13,.88),transparent)}
.search-wrap{position:relative}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;opacity:.8}
.search-box input{
    width:100%;height:48px;padding:0 42px 0 39px;border:1px solid var(--line);border-radius:13px;outline:none;
    background:rgba(18,16,29,.97);color:var(--text);font-size:15px;font-weight:800;
    box-shadow:0 5px 18px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.03)
}
.search-box input::placeholder{color:#6f687f}
.search-box input:focus{border-color:rgba(0,234,255,.7);box-shadow:0 0 0 3px rgba(0,234,255,.09),0 5px 18px rgba(0,0,0,.25)}
.search-clear{
    position:absolute;right:6px;top:4px;width:40px;height:40px;min-height:40px;border:0;background:transparent;
    color:var(--muted);font-size:19px;display:none
}
.search-clear.show{display:block}
.list-meta{display:flex;align-items:center;justify-content:space-between;min-height:20px;margin:0 2px 7px;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.35px;text-transform:uppercase}

/* New credential */
.new-card-form{
    display:none;flex-direction:column;gap:9px;margin-bottom:12px;padding:13px;
    border:1px solid rgba(255,234,0,.55);border-radius:14px;
    background:linear-gradient(180deg,rgba(31,25,48,.98),rgba(18,16,29,.98));box-shadow:0 8px 25px rgba(0,0,0,.3)
}
.new-form-title{color:var(--yellow);font-family:'Press Start 2P',cursive;font-size:8px;margin-bottom:2px}
.new-card-form input,.new-card-form select{
    width:100%;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:10px;outline:none;
    background:var(--surface3);color:var(--text);font-size:14px;font-weight:800
}
.new-card-form input:focus,.new-card-form select:focus{border-color:rgba(255,234,0,.7)}
.form-actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:2px}
.form-actions button{border:1px solid;background:transparent;padding:0 14px;font-weight:900}
.save-new{border-color:rgba(36,255,122,.7)!important;color:var(--green);background:rgba(36,255,122,.06)!important}
.cancel-new{border-color:rgba(255,75,85,.7)!important;color:#ff858b}

/* Credential cards */
.vault-list{display:flex;flex-direction:column;gap:10px}
.cred-card{
    overflow:hidden;background:linear-gradient(145deg,rgba(23,20,36,.98),rgba(14,12,23,.98));
    border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:14px;padding:12px;
    box-shadow:0 6px 20px rgba(0,0,0,.26)
}
.cred-card.particular{border-left-color:var(--pink)}
.cred-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.cred-service{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;font-size:15px;font-weight:1000}
.cred-badge{
    flex:0 0 auto;padding:4px 7px;border-radius:999px;font-size:8px;font-weight:1000;letter-spacing:.5px;text-transform:uppercase
}
.badge-comun{background:rgba(0,234,255,.09);border:1px solid rgba(0,234,255,.55);color:var(--cyan)}
.badge-particular{background:rgba(255,63,159,.09);border:1px solid rgba(255,63,159,.55);color:var(--pink)}
.cred-row{
    display:flex;align-items:center;gap:7px;min-height:48px;margin-top:7px;padding:5px 6px 5px 11px;
    border:1px solid rgba(44,38,64,.9);border-radius:10px;background:rgba(7,5,13,.58)
}
.cred-val{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f3f0fa;font-size:14px;font-weight:850}
.btn-touch-copy{
    flex:0 0 auto;width:43px;min-height:40px;padding:0;border:1px solid #352d4b;border-radius:9px;
    background:#1c1830;color:#fff;display:grid;place-items:center;font-size:16px;transition:transform .1s ease,background .1s ease
}
.btn-touch-copy:active{transform:scale(.94);background:rgba(0,234,255,.18)}
.pass-actions{display:flex;gap:5px}
.cred-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;color:#777084;font-size:9px;font-weight:800}
.delete-btn{
    min-height:34px;padding:0 10px;border:1px solid rgba(255,75,85,.5);border-radius:8px;
    color:#ff858b;background:rgba(255,75,85,.05);font-size:9px;font-weight:900
}

/* Empty state */
.empty-state{
    padding:34px 18px;border:1px dashed #302942;border-radius:14px;text-align:center;color:var(--muted);
    font-size:12px;line-height:1.65;background:rgba(18,16,29,.45)
}
.empty-icon{display:block;margin-bottom:9px;font-size:30px}

/* Toast */
#copyToast{
    position:fixed;left:50%;bottom:calc(18px + var(--safe-bottom));z-index:100000;width:max-content;max-width:calc(100vw - 28px);
    padding:11px 16px;transform:translate(-50%,90px);border:1px solid rgba(0,0,0,.2);border-radius:999px;
    background:var(--yellow);color:#090614;font-family:'Press Start 2P',cursive;font-size:8px;line-height:1.4;
    text-align:center;box-shadow:0 7px 25px rgba(0,0,0,.35),0 0 18px rgba(255,234,0,.2);
    opacity:0;transition:all .25s cubic-bezier(.175,.885,.32,1.275);pointer-events:none
}
#copyToast.show{transform:translate(-50%,0);opacity:1}

/* PIN screen */
.auth-overlay{
    position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;min-height:100dvh;
    padding:calc(18px + var(--safe-top)) 18px calc(18px + var(--safe-bottom));
    background:radial-gradient(circle at 50% 35%,rgba(83,43,139,.24),transparent 42%),#090614
}
.auth-box{
    width:min(100%,350px);padding:22px 18px 18px;border:1px solid rgba(255,234,0,.65);border-radius:18px;
    background:rgba(21,17,37,.97);box-shadow:0 18px 60px rgba(0,0,0,.5),0 0 30px rgba(255,234,0,.10);text-align:center
}
.auth-logo{
    display:grid;place-items:center;width:58px;height:58px;margin:0 auto 12px;border:1px solid rgba(255,234,0,.55);
    border-radius:17px;background:rgba(255,234,0,.07);font-size:28px;box-shadow:0 0 25px rgba(255,234,0,.08)
}
.auth-title{color:var(--yellow);font-family:'Press Start 2P',cursive;font-size:9px}
.auth-subtitle{margin-top:7px;color:var(--muted);font-size:11px;font-weight:800}
.pin-screen-val{
    min-height:58px;display:grid;place-items:center;margin:15px 0 12px;padding:10px;border:1px solid var(--line);
    border-radius:11px;background:#07040f;color:var(--yellow);font-family:'Press Start 2P',cursive;font-size:22px;
    letter-spacing:8px;box-shadow:inset 0 2px 8px rgba(0,0,0,.4)
}
.keypad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key-btn{
    min-height:58px;border:1px solid #332b48;border-radius:11px;background:linear-gradient(180deg,#211b36,#19152a);
    color:#fff;font-family:'Press Start 2P',cursive;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.35)
}
.key-btn:active{transform:translateY(2px);background:#302645;box-shadow:none}
.pin-danger{color:var(--red)!important}.pin-ok{color:var(--green)!important}
#pinError{min-height:15px;margin-top:9px;color:var(--red);font-size:10px;font-weight:900}

/* Responsive */
@media(max-width:340px){
    body{padding-left:9px;padding-right:9px}
    .header-title{font-size:8px}.header-sub{font-size:9px}.act-btn{font-size:11px}.cred-service{font-size:14px}.btn-touch-copy{width:40px}
}
@media(min-width:600px){
    body{max-width:620px;margin:0 auto;padding-left:18px;padding-right:18px}
    header{margin-left:-18px;margin-right:-18px;padding-left:18px;padding-right:18px}
    .actions-bar{grid-template-columns:repeat(4,1fr)}
}
@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
</style>
<body>

</div>

<!-- TOAST FLOTANTE COPIADO -->
<div id="copyToast">COPIADO AL PORTAPAPELES</div>

<header>
    <div class="header-title-box">
        <span class="header-icon">🔑</span>
        <div>
            <div class="header-title">VAULT POCKET</div>
            <div class="header-sub">Gestor Móvil · AES-256</div>
        </div>
    </div>
    <button class="btn-lock-top" onclick="bloquearApp()">BLOQUEAR</button>
</header>

<div class="actions-bar">
    <button class="act-btn btn-down" id="btnDownload" onclick="descargarNube()">☁️ BAJAR</button>
    <button class="act-btn btn-up" id="btnUpload" onclick="subirNube()">☁️ SUBIR</button>
    <button class="act-btn btn-new" onclick="toggleFormNuevo()">＋ NUEVA</button>

</div>
<div class="search-box">
    <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="search" id="searchInput" autocomplete="off" autocapitalize="none" placeholder="Buscar servicio o usuario…" oninput="filtrar(this.value)">
        <button class="search-clear" id="searchClear" aria-label="Limpiar búsqueda" onclick="limpiarBusqueda()">×</button>
    </div>
</div>
<div class="list-meta"><span id="listCount">0 claves</span><span id="listStatus">local</span></div>

<!-- FORMULARIO NUEVA CREDENCIAL -->
<div class="new-card-form" id="newCardForm">
    <div class="new-form-title">＋ NUEVA CREDENCIAL</div>
    <input type="text" id="newServicio" autocomplete="off" placeholder="Servicio (ej. Portal, Correo)">
    <input type="text" id="newUsuario" autocomplete="username" placeholder="Usuario">
    <input type="password" id="newPass" autocomplete="new-password" placeholder="Contraseña">
    <select id="newTipo" aria-label="Tipo de credencial">
        <option value="Común">Común</option><option value="Particular">Particular</option>
    </select>
    <div class="form-actions">
        <button class="save-new" onclick="guardarNuevaClave()">GUARDAR</button>
        <button class="cancel-new" onclick="toggleFormNuevo()">CANCELAR</button>
    </div>
</div>
<div class="vault-list id="vaultList"></div>

<script>
const GOOGLE_SCRIPT_URL="https://script.google.com/macros/s/AKfycbzr27kS6ZtDX3GSqjWRUTGxF1Uecp1x96yVAaPmPB4h2ogTRRcBdcR31IcUG0ZI3CNu/exec";

const SECURITY_VERSION = 2;
const PBKDF2_ITERATIONS = 250000;
const VAULT_STORAGE_KEY = "arcade_vault_secure";
const AUTH_STORAGE_KEY = "arcade_vault_auth";
const LEGACY_STORAGE_KEY = "arcade_vault";

let vault=[],filtroTexto="",pinBuffer="",toastTimer=null,busy=false;
let cryptoKey=null;
let securityMeta=null;

async function iniciar(){
    try{
        await cargarConfiguracionSegura();
    }catch(e){
        console.error("No se pudo inicializar la seguridad",e);
    }
    actualizarBusquedaUI();
    actualizarEstadoSeguridad();
    // If no secure vault exists, show the setup screen; otherwise require PIN.
    if(!securityMeta){
        mostrarConfiguracionInicial();
    }
}
function arrayBufferToBase64(buffer){
    let bytes=new Uint8Array(buffer),binary="";
    const chunk=0x8000;
    for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
    return btoa(binary);
}
function base64ToArrayBuffer(base64){
    const binary=atob(base64),bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    return bytes.buffer;
}
function randomBytes(length){return crypto.getRandomValues(new Uint8Array(length))}
async function sha256Base64(bytes){
    return arrayBufferToBase64(await crypto.subtle.digest("SHA-256",bytes));
}
async function deriveKey(pin,salt,usage=["encrypt","decrypt"]){
    const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey(
        {name:"PBKDF2",salt,iterations:PBKDF2_ITERATIONS,hash:"SHA-256"},
        material,{name:"AES-GCM",length:256},false,usage
    );
}
async function deriveVerifier(pin,salt){
    const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveBits"]);
    const bits=await crypto.subtle.deriveBits(
        {name:"PBKDF2",salt,iterations:PBKDF2_ITERATIONS,hash:"SHA-256"},material,256
    );
    return arrayBufferToBase64(bits);
}
async function encryptText(value){
    if(!cryptoKey)throw new Error("Vault bloqueado");
    const iv=randomBytes(12);
    const data=new TextEncoder().encode(value);
    const encrypted=await crypto.subtle.encrypt({name:"AES-GCM",iv},cryptoKey,data);
    return {v:SECURITY_VERSION,iv:arrayBufferToBase64(iv),data:arrayBufferToBase64(encrypted)};
}
async function decryptText(record){
    if(!cryptoKey)throw new Error("Vault bloqueado");
    const plain=await crypto.subtle.decrypt(
        {name:"AES-GCM",iv:new Uint8Array(base64ToArrayBuffer(record.iv))},
        cryptoKey,base64ToArrayBuffer(record.data)
    );
    return new TextDecoder().decode(plain);
}
function borrarSesion(){
    cryptoKey=null;
    vault=[];
}
function actualizarEstadoSeguridad(){
    const status=document.getElementById("listStatus");
    if(status)status.innerText=cryptoKey?"AES-256 · protegido":"bloqueado";
}
function mostrarConfiguracionInicial(){
    document.getElementById("authScreen").style.display="flex";
    document.querySelector(".auth-title").innerText="CONFIGURA TU VAULT";
    document.querySelector(".auth-subtitle").innerText="Crea un PIN de 6 dígitos";
    document.getElementById("pinError").innerText="";
    document.getElementById("pinError").style.display="block";
    document.getElementById("pinError").style.color="var(--muted)";
    document.getElementById("pinError").innerText="El PIN protegerá el contenido con AES-256.";
    window._setupMode=true;
}
function decodificarLegacy(valor){
    try{return decodeURIComponent(atob(valor))}
    catch(e){return String(valor||"")}
}
async function migrarLegacyVault(legacyVault){
    if(!Array.isArray(legacyVault))return [];
    const migrado=[];
    for(const k of legacyVault){
        let password="";
        if(typeof k.passwordCifrada==="string")password=decodificarLegacy(k.passwordCifrada);
        else if(k.passwordCifrada&&typeof k.passwordCifrada==="object")password="";
        migrado.push({
            servicio:k.servicio||"",
            usuario:k.usuario||"",
            tipo:k.tipo||"Común",
            fechaModif:k.fechaModif||"",
            passwordCifrada:await cifrarClaveNueva(password)
        });
    }
    return migrado;
}
async function configurarPIN(){
    const pin=pinBuffer;
    if(!/^\d{6}$/.test(pin)){
        mostrarErrorPIN("Usa exactamente 6 dígitos.");
        return;
    }
    try{
        const salt=randomBytes(16);
        const key=await deriveKey(pin,salt);
        const verifier=await deriveVerifier(pin,salt);
        securityMeta={
            version:SECURITY_VERSION,
            kdf:"PBKDF2-SHA256",
            iterations:PBKDF2_ITERATIONS,
            salt:arrayBufferToBase64(salt),
            verifier
        };
        cryptoKey=key;

        // Migrate the old local vault (base64-obfuscated passwords) once.
        let legacyVault=[];
        try{
            const legacyRaw=localStorage.getItem(LEGACY_STORAGE_KEY);
            if(legacyRaw)legacyVault=JSON.parse(legacyRaw);
        }catch(e){legacyVault=[]}

        if(Array.isArray(legacyVault)&&legacyVault.length){
            vault=await migrarLegacyVault(legacyVault);
        }else{
            vault=[];
        }

        guardarAuthMeta();
        await guardarLocal();
        // The old copy is no longer needed after successful encryption.
        localStorage.removeItem(LEGACY_STORAGE_KEY);
        document.getElementById("authScreen").style.display="none";
        borrarPin();
        window._setupMode=false;
        actualizarEstadoSeguridad();
        renderLista();
        lanzarToast("✓ VAULT PROTEGIDO");
    }catch(e){
        mostrarErrorPIN("No se pudo crear el vault seguro.");
        console.error(e);
    }
}
async function validarPin(){
    const pin=pinBuffer;
    if(window._setupMode){
        await configurarPIN();
        return;
    }
    if(!securityMeta){
        mostrarConfiguracionInicial();
        return;
    }
    if(!/^\d{6}$/.test(pin)){
        mostrarErrorPIN("Introduce los 6 dígitos.");
        return;
    }
    try{
        const salt=new Uint8Array(base64ToArrayBuffer(securityMeta.salt));
        const verifier=await deriveVerifier(pin,salt);
        if(verifier!==securityMeta.verifier)throw new Error("PIN incorrecto");

        cryptoKey=await deriveKey(pin,salt);
        await cargarVaultLocalSeguro();

        document.getElementById("authScreen").style.display="none";
        borrarPin();
        window._setupMode=false;
        actualizarEstadoSeguridad();
        renderLista();
        lanzarToast("✓ VAULT DESBLOQUEADO");
    }catch(e){
        borrarSesion();
        document.getElementById("pinDisplay").innerText="ERROR";
        mostrarErrorPIN("PIN INCORRECTO");
        if(navigator.vibrate)navigator.vibrate([35,30,35]);
        setTimeout(borrarPin,700);
    }
}
function mostrarErrorPIN(msg){
    const e=document.getElementById("pinError");
    e.innerText=msg;e.style.display="block";e.style.color="var(--red)";
    if(navigator.vibrate)navigator.vibrate([25,20,25]);
}
function tocarPin(n){
    if(pinBuffer.length<6){
        pinBuffer+=n;
        document.getElementById("pinDisplay").innerText="*".repeat(pinBuffer.length);
        if(navigator.vibrate)navigator.vibrate(12);
    }
}
function borrarPin(){
    pinBuffer="";
    document.getElementById("pinDisplay").innerText="----";
    if(!window._setupMode){
        const e=document.getElementById("pinError");
        e.style.display="none";
        e.innerText="";
    }
}
function bloquearApp(){
    borrarSesion();
    document.getElementById("authScreen").style.display="flex";
    document.getElementById("newCardForm").style.display="none";
    const title=document.querySelector(".auth-title"),sub=document.querySelector(".auth-subtitle");
    if(title)title.innerText="ACCESO RESTRINGIDO";
    if(sub)sub.innerText="Introduce tu PIN maestro";
    window._setupMode=false;
    borrarPin();
    actualizarEstadoSeguridad();
    window.scrollTo({top:0,behavior:"smooth"});
}
async function cargarConfiguracionSegura(){
    try{
        const raw=localStorage.getItem(AUTH_STORAGE_KEY);
        securityMeta=raw?JSON.parse(raw):null;
    }catch(e){securityMeta=null}

    // One-time compatibility path for the old local vault.
    if(!securityMeta){
        const legacy=localStorage.getItem(LEGACY_STORAGE_KEY);
        if(legacy){
            // Do not silently convert without authentication. The old application
            // used a hard-coded PIN, so we leave the legacy copy untouched until
            // the user explicitly creates the new secure vault.
        }
    }
}
function guardarAuthMeta(){
    localStorage.setItem(AUTH_STORAGE_KEY,JSON.stringify(securityMeta));
}
async function cargarVaultLocalSeguro(){
    const raw=localStorage.getItem(VAULT_STORAGE_KEY);
    if(!raw){vault=[];return}
    const payload=JSON.parse(raw);
    if(payload.version!==SECURITY_VERSION||!Array.isArray(payload.vault))throw new Error("Formato seguro inválido");
    const result=[];
    for(const item of payload.vault){
        result.push({
            servicio:item.servicio||"",
            usuario:item.usuario||"",
            tipo:item.tipo||"Común",
            fechaModif:item.fechaModif||"",
            passwordCifrada:item.passwordCifrada
        });
    }
    vault=result;
}
function esRegistroCifrado(k){
    return !!(k&&k.passwordCifrada&&typeof k.passwordCifrada==="object"&&k.passwordCifrada.v===SECURITY_VERSION);
}
async function protegerVault(){
    if(!cryptoKey)throw new Error("Vault bloqueado");
    const out=[];
    for(const k of vault){
        let encrypted=k.passwordCifrada;
        if(typeof encrypted==="string"){
            // Legacy records cannot be decrypted using the new key. Keep this
            // explicit so an old cloud vault is never mistaken for ciphertext.
            throw new Error("Hay credenciales antiguas sin migrar. Descarga/importa el vault antiguo desde una sesión compatible antes de protegerlo.");
        }
        out.push({
            servicio:k.servicio||"",
            usuario:k.usuario||"",
            tipo:k.tipo||"Común",
            fechaModif:k.fechaModif||"",
            passwordCifrada:encrypted
        });
    }
    localStorage.setItem(VAULT_STORAGE_KEY,JSON.stringify({version:SECURITY_VERSION,vault:out}));
}
async function cifrarClaveNueva(password){
    return await encryptText(password);
}
async function descifrarClave(k){
    if(esRegistroCifrado(k))return await decryptText(k.passwordCifrada);
    throw new Error("Credencial no cifrada");
}
async function guardarLocal(){
    if(!cryptoKey)throw new Error("Vault bloqueado");
    try{
        await protegerVault();
    }catch(e){
        console.error(e);
        lanzarToast("ERROR AL PROTEGER VAULT");
        throw e;
    }
}
function filtrar(val){filtroTexto=val.toLowerCase().trim();actualizarBusquedaUI();renderLista()}
function limpiarBusqueda(){const input=document.getElementById("searchInput");input.value="";filtrar("");input.focus()}
function actualizarBusquedaUI(){const clear=document.getElementById("searchClear");if(clear)clear.classList.toggle("show",filtroTexto.length>0)}
function toggleFormNuevo(){
    const f=document.getElementById("newCardForm"),abierto=f.style.display==="flex";f.style.display=abierto?"none":"flex";
    if(!abierto)setTimeout(()=>document.getElementById("newServicio").focus(),80);
}
async function guardarNuevaClave(){
    const s=document.getElementById("newServicio").value.trim(),u=document.getElementById("newUsuario").value.trim(),
          p=document.getElementById("newPass").value.trim(),t=document.getElementById("newTipo").value;
    if(!s||!p){lanzarToast("FALTAN SERVICIO Y CONTRASEÑA");(!s?document.getElementById("newServicio"):document.getElementById("newPass")).focus();return}
    const hoy=new Date(),fechaStr=`${hoy.getDate().toString().padStart(2,"0")}/${(hoy.getMonth()+1).toString().padStart(2,"0")}/${hoy.getFullYear()}`;
    const passwordCifrada=await cifrarClaveNueva(p);
    vault.push({servicio:s,usuario:u,passwordCifrada,tipo:t,fechaModif:fechaStr});
    await guardarLocal().then(()=>renderLista());
    document.getElementById("newServicio").value="";document.getElementById("newUsuario").value="";
    document.getElementById("newPass").value="";document.getElementById("newTipo").value="Común";toggleFormNuevo();
    lanzarToast("✓ CLAVE AÑADIDA");
}
function escapeHTML(value){return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]))}
async function renderLista(){
    const cont=document.getElementById("vaultList");if(!cont)return;cont.innerHTML="";
    if(vault.length===0){
        actualizarContador(0);cont.innerHTML='<div class="empty-state"><span class="empty-icon">🗝️</span><strong>LLAVERO VACÍO</strong><br>Pulsa <b>BAJAR</b> para traer tus claves de Google Sheets.</div>';return;
    }
    const filtradas=vault.filter(k=>{
        if(!filtroTexto)return true;const s=String(k.servicio||"").toLowerCase(),u=String(k.usuario||"").toLowerCase();
        return s.includes(filtroTexto)||u.includes(filtroTexto)
    });
    filtradas.sort((a,b)=>String(a.servicio||"").localeCompare(String(b.servicio||""),"es",{sensitivity:"base"}));
    actualizarContador(filtradas.length);
    if(!filtradas.length){
        cont.innerHTML=`<div class="empty-state"><span class="empty-icon">🔎</span>No se encontraron resultados para<br><strong>"${escapeHTML(filtroTexto)}"</strong></div>`;return;
    }
    for(const k of filtradas){
        const idx=vault.indexOf(k),tipo=k.tipo==="Particular"?"particular":"comun",
              usuario=k.usuario||"",servicio=k.servicio||"Sin nombre",card=document.createElement("div");
        let passReal="";
        try{passReal=await descifrarClave(k)}catch(e){passReal="";}
        card.className=`cred-card ${tipo}`;
        card.innerHTML=`
            <div class="cred-top"><span class="cred-service" title="${escapeHTML(servicio)}">${escapeHTML(servicio)}</span>
            <span class="cred-badge badge-${tipo}">${escapeHTML(k.tipo||"Común")}</span></div>
            <div class="cred-row"><span class="cred-val" title="${escapeHTML(usuario)}">${usuario?escapeHTML(usuario):'<span style="color:#665f73;">Sin usuario</span>'}</span>
            <button class="btn-touch-copy" aria-label="Copiar usuario">📋</button></div>
            <div class="cred-row"><span class="cred-val pass-value">••••••••</span>
            <div class="pass-actions"><button class="btn-touch-copy pass-toggle" aria-label="Mostrar contraseña">👁️</button>
            <button class="btn-touch-copy pass-copy" aria-label="Copiar contraseña">🔑</button></div></div>
            <div class="cred-footer"><span>Modif. ${escapeHTML(k.fechaModif||"-")}</span><button class="delete-btn">BORRAR</button></div>`;
        card.querySelector(".btn-touch-copy").addEventListener("click",()=>copiar(usuario,"USUARIO"));
        const passValue=card.querySelector(".pass-value"),passToggle=card.querySelector(".pass-toggle"),passCopy=card.querySelector(".pass-copy");
        let revealTimer=null;
        passToggle.addEventListener("click",()=>{
            const visible=passValue.dataset.visible==="1";if(revealTimer)clearTimeout(revealTimer);
            if(visible){passValue.innerText="••••••••";passValue.dataset.visible="0";passToggle.innerText="👁️"}
            else{
                passValue.innerText=passReal||"(vacía)";passValue.dataset.visible="1";passToggle.innerText="🙈";
                revealTimer=setTimeout(()=>{passValue.innerText="••••••••";passValue.dataset.visible="0";passToggle.innerText="👁️"},10000)
            }
        });
        passCopy.addEventListener("click",()=>copiar(passReal,"PASSWORD"));
        card.querySelector(".delete-btn").addEventListener("click",()=>borrarClave(idx));cont.appendChild(card);
    }
}
function actualizarContador(total){
    const el=document.getElementById("listCount"),status=document.getElementById("listStatus");
    if(el)el.innerText=`${total} ${total===1?"clave":"claves"}`;if(status)status.innerText=filtroTexto?"filtrado":"local";
}
async function copiar(txt,tipoLabel){
    if(!txt){lanzarToast("NO HAY NADA QUE COPIAR");return}
    try{await navigator.clipboard.writeText(txt)}
    catch(e){
        const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
        try{document.execCommand("copy")}catch(_){}ta.remove();
    }
    if(navigator.vibrate)navigator.vibrate(35);lanzarToast(`✓ ${tipoLabel} COPIADO`);
}
function lanzarToast(msg){
    const t=document.getElementById("copyToast");if(!t)return;clearTimeout(toastTimer);t.innerText=msg;t.classList.add("show");
    toastTimer=setTimeout(()=>t.classList.remove("show"),1700);
}
async function borrarClave(idx){
    if(idx<0||idx>=vault.length)return;const nombre=vault[idx].servicio||"esta credencial";
    if(confirm(`¿Eliminar "${nombre}" del llavero?`)){vault.splice(idx,1);await guardarLocal();await renderLista();lanzarToast("✓ CLAVE ELIMINADA")}
}
async function descargarNube(){
    if(!GOOGLE_SCRIPT_URL||busy)return;
    if(!cryptoKey){lanzarToast("DESBLOQUEA EL VAULT");return}
    if(!confirm("¿Descargar las claves desde Google Sheets?"))return;
    setBusy(true,"DESCARGANDO…");
    try{
        const res=await fetch(GOOGLE_SCRIPT_URL+"?action=getVault",{method:"GET",redirect:"follow",cache:"no-store"});
        const data=await res.json();
        if(data.status!=="success")throw new Error(data.message||"Respuesta no válida");

        const remote=Array.isArray(data.vault)?data.vault:[];

        // First secure import: transparently convert the old base64 format
        // into AES-GCM ciphertext before it is written locally/cloud.
        if(remote.some(k=>!esRegistroCifrado(k))){
            vault=await migrarLegacyVault(remote);
            await guardarLocal();
            await renderLista();

            // Persist the migrated ciphertext to Google Sheets so the old
            // obfuscated copy is replaced by authenticated encryption.
            try{
                await fetch(GOOGLE_SCRIPT_URL,{
                    method:"POST",mode:"no-cors",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({action:"saveVault",vault})
                });
            }catch(e){
                console.warn("La migración local fue correcta; no se pudo confirmar la subida.",e);
            }
            lanzarToast(`✓ ${vault.length} CLAVES MIGRADAS A AES-256`);
        }else{
            vault=remote;
            await guardarLocal();
            await renderLista();
            lanzarToast(`✓ ${vault.length} CLAVES DESCARGADAS`);
        }
    }catch(err){alert("No se pudieron descargar las claves.\n\n"+err.message)}
    finally{setBusy(false)}
}
async function subirNube(){
    if(!GOOGLE_SCRIPT_URL||busy)return;
    if(!cryptoKey){lanzarToast("DESBLOQUEA EL VAULT");return}
    if(!vault.length){lanzarToast("EL LLAVERO ESTÁ VACÍO");return}
    if(vault.some(k=>!esRegistroCifrado(k))){alert("Hay una credencial antigua sin cifrar. No se puede subir el vault hasta convertirla a formato seguro.");return}
    if(!confirm(`¿Subir ${vault.length} claves cifradas a Google Sheets?`))return;
    setBusy(true,"GUARDANDO…");
    try{
        await fetch(GOOGLE_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"saveVault",vault})});
        lanzarToast("✓ VAULT CIFRADO GUARDADO");
    }catch(err){alert("No se pudo guardar en Google Sheets.\n\n"+err.message)}
    finally{setBusy(false)}
}
function setBusy(state,label=""){
    busy=state;const down=document.getElementById("btnDownload"),up=document.getElementById("btnUpload");
    if(down){down.disabled=state;down.style.opacity=state?".55":"1";if(state&&label)down.dataset.original=down.innerText;down.innerText=state?(label||"…"):(down.dataset.original||"☁️ BAJAR")}
    if(up){up.disabled=state;up.style.opacity=state?".55":"1"}
}
async function exportarComunes(){
    const comunes=vault.filter(k=>k.tipo==="Común");
    if(!comunes.length){lanzarToast("NO HAY CLAVES COMUNES");return}
    let msg="🔐 *CREDENCIALES COMUNES TIENDA*\n\n";
    for(const k of comunes){
        let pass="";
        try{pass=await descifrarClave(k)}catch(e){pass="[NO DISPONIBLE]"}
        msg+=`🖥️ *${String(k.servicio||"").toUpperCase()}*\n`;
        msg+=`👤 Usuario: \`${k.usuario||"-"}\`\n`;
        msg+=`🔑 Clave: \`${pass}\`\n`;
        msg+="───────────────\n";
    }
    if(navigator.share){
        try{await navigator.share({title:"Claves Comunes",text:msg});return}
        catch(err){if(err&&err.name==="AbortError")return}
    }
    copiar(msg,"LISTA");
}
let backgroundAt=0;
document.addEventListener("visibilitychange",()=>{
    if(document.hidden)backgroundAt=Date.now();
    else if(backgroundAt&&Date.now()-backgroundAt>5*60*1000){bloquearApp();backgroundAt=0}
});
window.addEventListener("DOMContentLoaded",iniciar);
</script>
